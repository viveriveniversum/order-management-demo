<div class="auth-container">
    <h2 class="auth-title">Login with Magic Link</h2>

    <div *ngIf="!emailSent">
        <p class="auth-description">Sign in via magic link with your email below</p>

        <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" type="email" placeholder="Your email">
                <mat-error *ngIf="email?.invalid && email?.touched">
                    <span *ngIf="email?.errors?.['required']">Email is required</span>
                    <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
                </mat-error>
            </mat-form-field>

            <div class="form-actions">
                <button mat-flat-button color="primary" type="submit" class="submit-button"
                    [disabled]="signInForm.invalid || loading">
                    <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
                    <span *ngIf="!loading">Send magic link</span>
                </button>
            </div>
        </form>
    </div>

    <div *ngIf="emailSent" class="success-message">
        <mat-icon color="primary">check_circle</mat-icon>
        <div>
            <h3>Check your email!</h3>
            <p>We've sent a magic link to <strong>{{ signInForm.value.email }}</strong></p>
        </div>
        <button mat-flat-button color="primary" (click)="closeDialog()">OK</button>
    </div>

    <div *ngIf="error" class="error-message">
        <mat-icon color="warn">error</mat-icon>
        <p>{{ error }}</p>
    </div>
</div>
